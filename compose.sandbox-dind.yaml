# Optional overlay for Docker-backed OpenClaw agent sandboxes without exposing
# the host Docker socket to the OpenClaw gateway. The sidecar daemon is
# privileged inside Docker's Linux VM, so treat it as a contained blast-radius
# boundary rather than a perfect isolation boundary.
services:
  openclaw-gateway:
    image: ${OPENCLAW_SANDBOX_GATEWAY_IMAGE:-openclaw-gateway-secure:latest}
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      OPENCLAW_SANDBOX: "1"
    volumes:
      - type: volume
        source: openclaw_sandbox_docker_certs
        target: /certs/client
        read_only: true
    depends_on:
      openclaw-sandbox-docker:
        condition: service_healthy
    networks:
      - openclaw_internal
      - openclaw_sandbox_control

  openclaw-cli:
    image: ${OPENCLAW_SANDBOX_GATEWAY_IMAGE:-openclaw-gateway-secure:latest}
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    volumes:
      - type: volume
        source: openclaw_sandbox_docker_certs
        target: /certs/client
        read_only: true

  openclaw-sandbox-docker:
    image: docker:27-dind
    container_name: openclaw-sandbox-docker
    privileged: true
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      DOCKER_TLS_CERTDIR: /certs
    command:
      - --host=tcp://0.0.0.0:2376
      - --host=unix:///var/run/docker.sock
      - --icc=false
      - --userland-proxy=false
      - --dns=1.1.1.1
      - --dns=8.8.8.8
    volumes:
      - openclaw_sandbox_docker:/var/lib/docker
      - openclaw_sandbox_docker_certs:/certs/client
    networks:
      openclaw_sandbox_control:
        aliases:
          - docker
    healthcheck:
      test: ["CMD-SHELL", "DOCKER_HOST=tcp://localhost:2376 DOCKER_TLS_VERIFY=1 DOCKER_CERT_PATH=/certs/client docker info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  openclaw_sandbox_control:
    driver: bridge
    internal: true

volumes:
  openclaw_sandbox_docker:
  openclaw_sandbox_docker_certs:
